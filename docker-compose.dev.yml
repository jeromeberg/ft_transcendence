name: typerun

services:
  nginx:
    environment:
      - DOMAIN=localhost

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - ./backend:/backend:ro
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - DOMAIN=localhost
      - NODE_ENV=development
      - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID_DEV:-}
      - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET_DEV:-}
      - FORTYTWO_CALLBACK_URL=http://localhost:3000/auth/42/callback
      - FRONTEND_URL=http://localhost:5173

  postgresql:
    ports:
      - "5432:5432"

volumes:
  backend_node_modules:
  frontend_node_modules:
